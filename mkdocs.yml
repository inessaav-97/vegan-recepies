site_name: 🌿 Livro de Receitas Vegan
theme:
  name: material
  language: pt
  palette:
    - scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/weather-night
        name: Modo escuro
    - scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  font:
    text: Lato
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - search.highlight
    - content.tooltips
  icon:
    logo: material/leaf

plugins:
  - search

